<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Report an item | CampusConnect</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><a class="brand" href="/">↗ Campus<span>Connect</span></a><nav><a href="/">Home</a><a href="/dashboard.html">Dashboard</a></nav></header><main class="form-page"><p class="eyebrow">HELP AN ITEM FIND ITS WAY</p><h1>Report an item</h1><p class="muted">Share clear details so the campus community can help.</p><form id="report-form" class="panel form-grid" enctype="multipart/form-data"><label>Report type<select name="type" required><option value="lost">I lost this item</option><option value="found">I found this item</option></select></label><label>Item name<input name="title" required maxlength="100" placeholder="e.g. Black wallet"></label><label>Category<select name="category" required><option value="">Choose category</option><option>Electronics</option><option>Books</option><option>ID Cards</option><option>Clothing</option><option>Accessories</option><option>Keys</option><option>Other</option></select></label><label>Campus location<input name="location" required maxlength="120" placeholder="e.g. Central Library"></label><label>Date<input name="date" type="date" required></label><label class="wide">Description<textarea name="description" required maxlength="1000" rows="4" placeholder="Describe the item, colour, identifying marks..."></textarea></label><label class="wide">Photo (optional, JPG/PNG/WEBP; max 3MB)<input name="image" type="file" accept="image/jpeg,image/png,image/webp"></label><div class="wide"><button class="btn primary">Submit report</button><p id="form-message" class="form-message"></p></div></form></main><script src="/app.js"></script></body></html>
